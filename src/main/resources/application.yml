spring:
  application:
    name: meet-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/meet_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  cache:
    type: redis
    redis:
      time-to-live: 300000
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-minimum-256-bits-change-in-production-please-make-it-very-long}
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000
  
  sms:
    provider: ${SMS_PROVIDER:console}
    rate-limit:
      attempts: 3
      window-hours: 1
  
  s3:
    enabled: ${S3_ENABLED:false}
    bucket-name: ${S3_BUCKET_NAME:meet-storage}
  
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:./serviceAccountKey.json}
  project-id: ${FIREBASE_PROJECT_ID:meet-backend-v2}

logging:
  level:
    root: INFO
    dev.whysoezzy: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      enabled: true
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: dev.whysoezzy.meet.api.controller
  paths-to-exclude: /actuator/**
